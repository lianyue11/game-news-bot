name: Daily game industry digest

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-industry-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore sent-item database
        uses: actions/cache/restore@v4
        with:
          path: gameintel.db
          key: gameintel-db-${{ github.run_id }}
          restore-keys: |
            gameintel-db-

      - name: Collect, summarize and send
        env:
          PYTHONUTF8: "1"
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
          LLM_MODEL: gemini-2.5-flash
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: python -m gameintel run

      - name: Save sent-item database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: gameintel.db
          key: gameintel-db-${{ github.run_id }}
